# coturn for Connect's peer-to-peer calls (relays the ~10-15% of users whose
# network blocks direct WebRTC). Deployment-specific values are passed on the
# command line by the compose file: --external-ip (public/private, for the
# cloud's 1:1 NAT), --realm, --static-auth-secret, --cert, --pkey.

listening-port=3478
# turns:// for strict corporate/school networks
tls-listening-port=5349

# Relay ports. Kept clear of LiveKit's 50000-60000 range.
min-port=49152
max-port=49999

fingerprint

# Short-lived credentials minted by the backend's GET /api/ice; the secret
# must equal the backend's TURN_SECRET.
use-auth-secret

no-tlsv1
no-tlsv1_1

# Budget on a shared VM: SD video needs ~0.6 Mbps each way per relayed user.
# 125000 bytes/s = 1 Mbps per allocation; ~40 allocations ~= 40 Mbps worst case.
max-bps=125000
total-quota=40
user-quota=4
stale-nonce=600

# Never relay into private / link-local ranges. On GCP that includes your VPC and
# the metadata server (169.254.169.254) — an open TURN relay there is an SSRF.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
